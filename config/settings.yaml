refresh_minutes: 15
scheduler_enabled: true
# Start from cached data. Use POST /api/refresh for the initial backfill.
refresh_on_startup: false
market_calendar: NYSE
market_timezone: America/New_York
history_period: 2y
news_lookback_hours: 48
max_watchlist_size: 50
# Index quotes for the dashboard snapshot. Yahoo symbols; no Finnhub fallback.
market_indices:
  - symbol: ^GSPC
    name: S&P 500
  - symbol: ^IXIC
    name: Nasdaq Composite
  - symbol: ^DJI
    name: Dow Jones Industrial Average
request_timeout_seconds: 15
retry_attempts: 3
finnhub_requests_per_minute: 50
news_analysis:
  enabled: true
  model: gemini-3.1-flash-lite
  max_articles: 12
  max_excerpt_chars: 1200
  max_output_tokens: 6000
  timeout_seconds: 45
  retry_attempts: 2
  min_interval_seconds: 6
  # Local cap counts all attempts/retries, resets at UTC midnight.
  max_calls_per_day: 100
cache_seconds:
  quote: 900
  history: 3600
  fundamentals: 86400
  news: 900
  rss: 900
seed_watchlist:
  - ticker: AAPL
    company_name: Apple
  - ticker: NVDA
    company_name: Nvidia
  - ticker: MSFT
    company_name: Microsoft
